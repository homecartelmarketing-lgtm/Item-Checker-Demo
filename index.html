<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Item Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Item Checker</h1>
      <span class="sub">Does each gallery photo show the same product as the hero?</span>
    </div>
    <div class="actions">
      <label class="toggle" title="Ignore cached answers and ask Qwen again">
        <input type="checkbox" id="fresh"> Re-check all
      </label>
      <button id="btnRun" class="primary">Check all photos</button>
      <button id="btnStop" class="ghost" hidden>Stop</button>
      <a id="btnExport" class="ghost btn" href="/api/export_csv">Download CSV</a>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div id="progress" class="progress" hidden>
    <div class="bar"><div id="progressFill" class="fill"></div></div>
    <span id="progressText"></span>
  </div>

  <nav class="filters">
    <div id="tabs" class="tabs">
      <button data-filter="all" class="on">All <b id="c-all">0</b></button>
      <button data-filter="invalid">Invalid <b id="c-invalid">0</b></button>
      <button data-filter="review">Review <b id="c-review">0</b></button>
      <button data-filter="valid">Valid <b id="c-valid">0</b></button>
      <button data-filter="error">Error <b id="c-error">0</b></button>
      <button data-filter="unchecked">Not checked <b id="c-unchecked">0</b></button>
    </div>
    <input id="search" type="search" placeholder="Search product…">
  </nav>

  <main id="list"><p class="empty">Loading products…</p></main>

  <div id="viewer" class="viewer" hidden>
    <div class="pair">
      <figure><img id="vHero" alt=""><figcaption>Hero</figcaption></figure>
      <figure><img id="vCand" alt=""><figcaption id="vCap">Photo</figcaption></figure>
    </div>
    <p id="vReason" class="vreason"></p>
    <div class="vops">
      <button id="vValid" class="ok">✓ Valid</button>
      <button id="vInvalid" class="bad">✗ Invalid</button>
      <button id="vClose" class="ghost">Close (Esc)</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
